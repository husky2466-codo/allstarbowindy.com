server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static demo: serve files; fall back to index.html for unknown paths
    # so client-side routing / direct page hits don't 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long cache for static assets, but keep HTML fresh during the pitch.
    location ~* \.(css|js|jsx|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
}
