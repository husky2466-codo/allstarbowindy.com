# All Star Bowl pitch demo — static site served by nginx.
# Bound to 127.0.0.1:8090 to match the existing Cloudflare tunnel ingress
# (allstarbowlindy.myroproductions.com -> http://localhost:8090), so the
# public URL keeps working with no dashboard changes.
services:
  allstarbowl:
    image: nginx:1.27-alpine
    container_name: allstarbowl-demo
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:80"
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
